# Runs the self-managed Solace Micro-Integration for Databricks Zerobus.
# Image name per Solace's Docker Hub listing. Docker Hub currently offers only
# the ":latest" tag (no version tags):
# https://hub.docker.com/r/solace/solace-micro-integration-databricks-zerobus
# For reproducible runs, pin the image by digest in .env, see README.md
# ("Pinning the image"). Without ZEROBUS_MI_IMAGE the default below is used.

services:
  zerobus-integration:
    image: ${ZEROBUS_MI_IMAGE:-solace/solace-micro-integration-databricks-zerobus:latest}
    # The image is published for linux/amd64 only. Pinning the platform makes
    # Docker on Apple Silicon run it under emulation without a warning.
    platform: linux/amd64
    container_name: zerobus-integration
    env_file:
      - .env
    # NOT CONFIRMED: the exact in-container config path (Spring Boot's
    # usual /config convention is assumed here). Verify against Solace's
    # "Deploying a self-managed Micro-Integration" guide and adjust the
    # mount target if it differs.
    volumes:
      - ./application.yml:/config/application.yml:ro
    ports:
      - "8081:8090" # Actuator health/info endpoint (app listens on 8090) -- see README.md
    restart: unless-stopped
